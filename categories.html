<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores - Categories

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:#111;

color:white;

padding-bottom:90px;

overflow-x:hidden;

}

/* Banner */

.banner{

width:100%;

overflow:hidden;

background:#000;

}

.banner img{

width:100%;

display:block;

border-bottom:3px solid #f39c12;

}

/* Header */

.header{

padding:20px;

text-align:center;

}

.header h1{

color:#f39c12;

font-size:32px;

margin-bottom:10px;

}

.header p{

color:#ccc;

font-size:15px;

}

/* Search */

.search-section{

padding:0 20px 20px;

}

.search-box{

display:flex;

align-items:center;

background:#1c1c1c;

border:2px solid #333;

border-radius:18px;

padding:15px;

transition:.3s;

}

.search-box:hover{

border-color:#f39c12;

}

.search-box input{

width:100%;

background:none;

border:none;

outline:none;

color:white;

font-size:16px;

}

.search-box input::placeholder{

color:#999;

}

/* Category Grid */

.categories{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:18px;

padding:20px;

}

.category-card{

background:linear-gradient(
135deg,
#1b1b1b,
#2b2b2b
);

border:2px solid #333;

border-radius:20px;

padding:25px 15px;

text-align:center;

cursor:pointer;

transition:.35s;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

min-height:180px;

box-shadow:0 8px 18px rgba(0,0,0,.25);

}

.category-card:hover{

transform:translateY(-6px);

border-color:#f39c12;

box-shadow:0 0 20px rgba(243,156,18,.45);

}

.category-icon{

font-size:50px;

margin-bottom:15px;

}

.category-card h3{

font-size:19px;

color:#f39c12;

margin-bottom:10px;

}

.category-card p{

font-size:14px;

color:#ccc;

line-height:1.5;

}

.browse{

margin-top:15px;

font-weight:bold;

color:#2ecc71;

}

.fade{

animation:fadeIn .8s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}
/* Bottom Navigation */

.bottom-nav{

position:fixed;

left:0;

right:0;

bottom:0;

height:72px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:2px solid #f39c12;

box-shadow:0 -2px 15px rgba(0,0,0,.45);

z-index:999;

}

.bottom-nav a{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-decoration:none;

color:#ddd;

font-size:13px;

font-weight:bold;

transition:.3s;

}

.bottom-nav a div{

font-size:22px;

margin-bottom:4px;

}

.bottom-nav a:hover{

color:#f39c12;

transform:translateY(-3px);

}

.bottom-nav a.active{

color:#f39c12;

}

@media(max-width:480px){

.header h1{

font-size:28px;

}

.categories{

grid-template-columns:repeat(2,1fr);

gap:15px;

padding:15px;

}

.category-card{

min-height:170px;

padding:20px 10px;

}

.category-icon{

font-size:44px;

}

.category-card h3{

font-size:17px;

}

.category-card p{

font-size:13px;

}

}

</style>

</head>

<body class="fade">

<!-- Banner -->

<div class="banner">

<img

src="images/Banner.jpeg"

alt="SLV Banner">

</div>

<!-- Header -->

<div class="header">

<h1>

🛒 Shop By Category

</h1>

<p>

Choose a category to start shopping

</p>

</div>

<!-- Search -->

<div class="search-section">

<div class="search-box">

<input

type="text"

id="searchBox"

placeholder="🔍 Search Categories..."

onkeyup="searchCategory()">

</div>

</div>

<!-- Categories -->

<div

class="categories"

id="categoriesContainer">

</div>
<script>

const categories=[

{
name:"New Arrivals",
icon:"🆕",
description:"Latest Products In Store"
},

{
name:"Rice & Grains",
icon:"🍚",
description:"Rice, Wheat, Millets & More"
},

{
name:"Dal & Pulses",
icon:"🫘",
description:"Toor, Moong, Chana & More"
},

{
name:"Atta & Sooji",
icon:"🌾",
description:"Flour, Rava & Sooji"
},

{
name:"Oil & Ghee",
icon:"🛢",
description:"Cooking Oils & Pure Ghee"
},

{
name:"Sugar Salt & Jaggery",
icon:"🧂",
description:"Daily Kitchen Essentials"
},

{
name:"Masala & Spices",
icon:"🌶",
description:"Spices & Masala Powders"
},

{
name:"Dry Fruits",
icon:"🥜",
description:"Healthy Nuts & Dry Fruits"
},

{
name:"Tea Coffee & Beverages",
icon:"🥤",
description:"Tea, Coffee & Soft Drinks"
},

{
name:"Biscuits & Snacks",
icon:"🍪",
description:"Biscuits, Chips & Snacks"
},

{
name:"Personal Care",
icon:"🧴",
description:"Soap, Shampoo & Hygiene"
},

{
name:"Home Care",
icon:"🧹",
description:"Cleaning & Household Items"
},

{
name:"Stationery",
icon:"📒",
description:"Books, Pens & School Items"
},

{
name:"Pooja Items",
icon:"🙏",
description:"Agarbatti, Camphor & More"
},

{
name:"Dairy Products",
icon:"🥛",
description:"Milk, Butter & Paneer"
},

{
name:"Baby Care",
icon:"👶",
description:"Baby Food & Daily Care"
},

{
name:"OTC Products",
icon:"💊",
description:"Basic Health & Wellness"
}

];

function loadCategories(){

let html="";

categories.forEach(category=>{

html+=`

<div
class="category-card"
onclick="openCategory('${category.name}')">

<div class="category-icon">

${category.icon}

</div>

<h3>

${category.name}

</h3>

<p>

${category.description}

</p>

<div class="browse">

Browse →

</div>

</div>

`;

});

document.getElementById(

"categoriesContainer"

).innerHTML=html;

}

function searchCategory(){

const value=

document.getElementById(

"searchBox"

).value.toLowerCase();

const cards=

document.querySelectorAll(

".category-card"

);

cards.forEach(card=>{

const text=

card.innerText.toLowerCase();

if(text.includes(value)){

card.style.display="flex";

}

else{

card.style.display="none";

}

});

}

function openCategory(category){

window.location.href=

`subcategory.html?main_category=${encodeURIComponent(category)}`;

}

loadCategories();
/* Bottom Navigation Active */

const navLinks=

document.querySelectorAll(

".bottom-nav a"

);

navLinks.forEach(link=>{

link.addEventListener("click",()=>{

navLinks.forEach(item=>{

item.classList.remove("active");

});

link.classList.add("active");

});

});

/* Card Animation */

const observer=

new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.style.opacity="1";

entry.target.style.transform="translateY(0px)";

}

});

},
{
threshold:0.15
});

document.addEventListener(

"DOMContentLoaded",

()=>{

document.querySelectorAll(

".category-card"

).forEach(card=>{

card.style.opacity="0";

card.style.transform="translateY(25px)";

card.style.transition=".6s";

observer.observe(card);

});

});

/* Press Enter To Search */

document.getElementById(

"searchBox"

).addEventListener(

"keypress",

function(e){

if(e.key==="Enter"){

searchCategory();

}

});

</script>

<!-- Bottom Navigation -->

<div class="bottom-nav">

<a
href="customer-home.html">

<div>

🏠

</div>

<span>

Home

</span>

</a>

<a
href="categories.html"
class="active">

<div>

📂

</div>

<span>

Categories

</span>

</a>

<a
href="customer-cart.html">

<div>

🛒

</div>

<span>

Cart

</span>

</a>

<a
href="customer-profile.html">

<div>

👤

</div>

<span>

Profile

</span>

</a>

<a
href="my-orders.html">

<div>

📦

</div>

<span>

Orders

</span>

</a>

</div>

</body>

</html>
