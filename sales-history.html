<!DOCTYPE html>
<html>

<head>

<title>Sales History</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:20px;
}

h1{
color:#f39c12;
text-align:center;
}

input,
button{

padding:12px;

margin:10px;

border:none;

border-radius:10px;

}

button{

background:#f39c12;

font-weight:bold;

cursor:pointer;

}

.card{

background:#1c1c1c;

padding:20px;

border-radius:15px;

margin-top:20px;

}

</style>

</head>

<body>

<h1>
Sales History
</h1>

<input
type="date"
id="salesDate">

<button
onclick="loadSales()">

Get Report

</button>

<div class="card">

<h3>
Revenue
</h3>

<h2 id="revenue">
₹0
</h2>

<h3>
Bills
</h3>

<h2 id="bills">
0
</h2>

</div>
<script>

async function loadSales(){

const date =

document.getElementById(
'salesDate'
).value;

if(!date){

alert(
'Select Date'
);

return;

}

const response =

await fetch(

`http://localhost:5000/sales-by-date/${date}`

);

const data =

await response.json();

document.getElementById(
'revenue'
).innerText =

'₹' +

parseFloat(
data.revenue || 0
).toFixed(2);

document.getElementById(
'bills'
).innerText =

data.total_bills;

}

</script>

</body>

</html>
