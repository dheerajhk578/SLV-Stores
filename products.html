<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SLV Grocery Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111111;
color:white;
padding:15px;
}

h2{
text-align:center;
margin-bottom:20px;
color:#f5b041;
font-size:32px;
font-weight:bold;
}

.cart-icon{
position:fixed;
top:15px;
right:15px;
background:#f39c12;
color:black;
padding:12px 18px;
border-radius:25px;
font-weight:bold;
cursor:pointer;
z-index:999;
box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.search-box{
margin-bottom:20px;
}

.search-box input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#1c1c1c;
color:white;
font-size:16px;
outline:none;
border:1px solid #333;
}

.search-box input::placeholder{
color:#aaa;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:#1c1c1c;
border-radius:15px;
padding:15px;
border:1px solid #333;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
border-color:#f39c12;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
background:white;
margin-bottom:10px;
}

.card h3{
color:#f5b041;
margin-bottom:8px;
font-size:22px;
}

.card p{
color:#ddd;
}

.price{
color:#2ecc71;
font-weight:bold;
font-size:22px;
margin-top:5px;
}

.stock{
color:#ccc;
margin-top:5px;
font-size:15px;
}

.add-btn{
width:100%;
padding:12px;
margin-top:12px;
background:#f39c12;
color:black;
border:none;
border-radius:10px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.add-btn:hover{
background:#f5b041;
}

.no-products{
text-align:center;
font-size:22px;
color:#f5b041;
margin-top:50px;
}
</style>

</head>

<body>

<div
class="cart-icon"
onclick="openCart()">

🛒 Cart (
<span id="cartCount">0</span>
)

</div>

<h2 id="pageTitle">
Products
</h2>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Products..."
onkeyup="searchProducts()">

</div>

<div
class="products"
id="products">
</div>

<script>

const selectedSubCategory =
localStorage.getItem(
'selectedSubCategory'
);

document.getElementById(
'pageTitle'
).innerText =
selectedSubCategory;
function updateCartCount(){

const cart =
JSON.parse(
localStorage.getItem('cart')
) || [];

document.getElementById(
'cartCount'
).innerText =
cart.length;

}

function openCart(){

window.location.href =
'customer-cart.html';

}

function searchProducts(){

const search =
document.getElementById(
'searchInput'
).value.toLowerCase();

const cards =
document.querySelectorAll(
'.card'
);

cards.forEach(card=>{

card.style.display =
card.innerText.toLowerCase().includes(search)
?
'block'
:
'none';

});

}
function filterCategory(){

const selectedCategory =
document.getElementById("categoryFilter").value;

const cards =
document.querySelectorAll(".card");

cards.forEach(card => {

const category =
card.getAttribute("data-category");

if(
selectedCategory === "" ||
category === selectedCategory
){
card.style.display = "block";
}
else{
card.style.display = "none";
}

});

}
function filterCategory(){

const selectedCategory =
document.getElementById("categoryFilter").value;

console.log("Selected:", selectedCategory);

const cards =
document.querySelectorAll(".card");

cards.forEach(card => {

const category =
card.getAttribute("data-category");

console.log(
"Card:",
card.querySelector("h3").innerText,
"Category:",
category
);

if(
selectedCategory === "" ||
category === selectedCategory
){
card.style.display = "block";
}
else{
card.style.display = "none";
}

});

}

async function loadProducts(){

try{

const response =
await fetch(
'http://localhost:5000/products'
);

window.products =
await response.json();

let html = '';

const filteredProducts =
products.filter(product =>
product.sub_category === selectedSubCategory
);
filteredProducts.sort((a,b)=>
a.product_name.localeCompare(b.product_name)
);

filteredProducts.forEach(product=>{

const imageUrl =
product.product_image
?
`http://localhost:5000/${product.product_image}`
:
'https://via.placeholder.com/300x200?text=No+Image';

html += `

<div
class="card"
data-category="${product.main_category}"
onclick="openProduct(${product.id})">

<img src="${imageUrl}">

<h3>
${product.product_name}
</h3>

<p>
${product.brand || ''}
</p>

<p class="price">
₹${product.retail_price}
</p>

<p class="stock">
Stock:
${product.stock_quantity}
${product.unit}
</p>
<button
class="add-btn"
onclick="event.stopPropagation(); addToCart(${product.id})">
Add To Cart
</button>

</div>

`;

});

if(filteredProducts.length === 0){

html = `
<h3>
No Products Found
</h3>
`;

}

document.getElementById(
'products'
).innerHTML =
html;

}
catch(error){

console.error(error);

document.getElementById(
'products'
).innerHTML =
'<h3>Failed To Load Products</h3>';

}

}

function openProduct(id){

localStorage.setItem(
'selectedProductId',
id
);

window.location.href =
'product-details.html';

}

loadProducts();
updateCartCount();

function addToCart(productId){

const product =
products.find(
p => p.id === productId
);

let cart =
JSON.parse(
localStorage.getItem('cart')
) || [];

const existing =
cart.find(
item => item.id === productId
);

if(existing){

existing.quantity += 1;

}
else{

cart.push({

id: product.id,
product_name: product.product_name,
brand: product.brand,
retail_price: product.retail_price,
product_image: product.product_image,
unit: product.unit,
quantity: 1

});

}

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

updateCartCount();

alert('Added To Cart');

}

</script>

</body>

</html>
