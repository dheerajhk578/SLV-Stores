<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores - Stock In

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:#111;

color:white;

padding:20px;

padding-bottom:40px;

}

/* Header */

.header{

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:15px;

margin-bottom:25px;

}

.logo{

font-size:32px;

font-weight:bold;

color:#f39c12;

}

.back-btn{

padding:12px 20px;

background:#f39c12;

color:#111;

text-decoration:none;

font-weight:bold;

border-radius:10px;

transition:.3s;

}

.back-btn:hover{

background:#ffb84d;

}

/* Main Card */

.stock-card{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:25px;

box-shadow:0 10px 20px rgba(0,0,0,.25);

margin-bottom:25px;

}

.stock-card h2{

color:#f39c12;

margin-bottom:20px;

}

.search-box{

margin-bottom:20px;

}

.search-box input{

width:100%;

padding:15px;

border:none;

outline:none;

background:#2b2b2b;

color:white;

border-radius:15px;

font-size:16px;

border:2px solid #333;

transition:.3s;

}

.search-box input:focus{

border-color:#f39c12;

}

.product-preview{

display:flex;

align-items:center;

gap:20px;

margin-bottom:20px;

}

.product-preview img{

width:110px;

height:110px;

background:white;

border-radius:15px;

object-fit:contain;

padding:8px;

}

.product-info h3{

color:#f39c12;

margin-bottom:8px;

}

.product-info p{

margin:5px 0;

color:#ddd;

}
/* Form */

.form-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:18px;

margin-top:20px;

}

.form-group{

display:flex;

flex-direction:column;

}

.form-group label{

margin-bottom:8px;

color:#ddd;

font-weight:bold;

}

.form-group input,

.form-group select{

padding:14px;

border:none;

outline:none;

border-radius:12px;

background:#2b2b2b;

color:white;

font-size:15px;

border:2px solid #333;

transition:.3s;

}

.form-group input:focus,

.form-group select:focus{

border-color:#f39c12;

}

/* Save Button */

.save-btn{

width:100%;

margin-top:25px;

padding:16px;

background:#2ecc71;

color:white;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.save-btn:hover{

background:#27ae60;

transform:translateY(-2px);

}

/* Recent Entries */

.history-card{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:25px;

box-shadow:0 10px 20px rgba(0,0,0,.25);

}

.history-card h2{

color:#f39c12;

margin-bottom:20px;

}

.table-container{

overflow-x:auto;

}

table{

width:100%;

border-collapse:collapse;

min-width:800px;

}

th{

background:#f39c12;

color:#111;

padding:14px;

text-align:center;

}

td{

padding:12px;

border-bottom:1px solid #333;

text-align:center;

color:#ddd;

}

tr:hover{

background:#252525;

}
/* Animation */

.fade{

animation:fadeIn .8s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.header{

flex-direction:column;

align-items:flex-start;

}

.product-preview{

flex-direction:column;

text-align:center;

}

.form-grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body class="fade">

<div class="header">

<div class="logo">

📥 Stock In

</div>

<a

href="dashboard.html"

class="back-btn">

⬅ Dashboard

</a>

</div>

<div class="stock-card">

<h2>

Add Stock Entry

</h2>

<div class="search-box">

<input

type="text"

id="searchProduct"

placeholder="🔍 Search Product..."

onkeyup="filterProducts()">

</div>

<div class="product-preview">

<img

id="productImage"

src="images/no-image.png"

alt="Product">

<div class="product-info">

<h3 id="productName">

Select Product

</h3>

<p>

Current Stock :

<b id="currentStock">

0

</b>

</p>

<p>

Retail Price :

₹<span id="retailPrice">

0.00

</span>

</p>

<p>

Wholesale Price :

₹<span id="wholesalePrice">

0.00

</span>

</p>

</div>

</div>

<div class="form-grid">

<div class="form-group">

<label>

Select Product

</label>

<select

id="productSelect"

onchange="updateProductPreview()">

</select>

</div>

<div class="form-group">

<label>

Supplier Name

</label>

<input

type="text"

id="supplier"

placeholder="Supplier Name">

</div>

<div class="form-group">

<label>

Purchase Date

</label>

<input

type="date"

id="purchaseDate">

</div>

<div class="form-group">

<label>

Quantity To Add

</label>

<input

type="number"

id="quantity"

min="1"

placeholder="Enter Quantity">

</div>

</div>

<button

class="save-btn"

onclick="addStock()">

📥 Add Stock

</button>

</div>

<div class="history-card">

<h2>

Recent Stock Entries

</h2>

<div class="table-container">

<table>

<thead>

<tr>

<th>

Product

</th>

<th>

Supplier

</th>

<th>

Qty

</th>

<th>

Date

</th>

<th>

Status

</th>

</tr>

</thead>

<tbody id="historyBody">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>
<script>

let products=[];

async function loadProducts(){

try{

const response=

await fetch(

"https://obtain-handles-creator-morning.trycloudflare.com/products"

);

products=

await response.json();

let options="";

products.forEach(product=>{

options+=`

<option value="${product.id}">

${product.product_name}

|

${product.brand||"-"}

|

Stock :

${product.stock_quantity}

</option>

`;

});

document.getElementById(

"productSelect"

).innerHTML=

options;

updateProductPreview();

loadHistory();

}

catch(error){

console.error(error);

alert(

"Failed To Load Products"

);

}

}

function updateProductPreview(){

const id=

Number(

document.getElementById(

"productSelect"

).value

);

const product=

products.find(p=>p.id===id);

if(!product){

return;

}

document.getElementById(

"productImage"

).src=

product.product_image

?

`https://obtain-handles-creator-morning.trycloudflare.com/uploads/${product.product_image}`

:

"images/no-image.png";

document.getElementById(

"productImage"

).onerror=function(){

this.src="images/no-image.png";

};

document.getElementById(

"productName"

).innerText=

product.product_name;

document.getElementById(

"currentStock"

).innerText=

product.stock_quantity+" "+(product.unit||"");

document.getElementById(

"retailPrice"

).innerText=

Number(product.retail_price).toFixed(2);

document.getElementById(

"wholesalePrice"

).innerText=

Number(product.wholesale_price).toFixed(2);

}

function filterProducts(){

const value=

document.getElementById(

"searchProduct"

).value.toLowerCase();

const select=

document.getElementById(

"productSelect"

);

for(let option of select.options){

option.hidden=

!option.text.toLowerCase().includes(value);

}

}

async function addStock(){

const product_id=

document.getElementById(

"productSelect"

).value;

const quantity=

document.getElementById(

"quantity"

).value;

const supplier=

document.getElementById(

"supplier"

).value.trim();

const purchase_date=

document.getElementById(

"purchaseDate"

).value;

if(quantity===""||Number(quantity)<=0){

alert(

"Enter valid quantity."

);

return;

}

try{

await fetch(

"https://obtain-handles-creator-morning.trycloudflare.com/stock-in",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

product_id,

quantity,

supplier,

purchase_date

})

}

);

alert(

"Stock Added Successfully"

);

document.getElementById(

"quantity"

).value="";

loadProducts();

}

catch(error){

console.error(error);

alert(

"Failed To Add Stock"

);

}

}

async function loadHistory(){

const tbody=

document.getElementById(

"historyBody"

);

tbody.innerHTML=`

<tr>

<td colspan="5">

Recent entries will appear here.

</td>

</tr>

`;

}

loadProducts();

</script>

</body>

</html>
