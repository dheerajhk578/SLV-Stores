<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores - My Orders

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:#111;

color:white;

padding-bottom:90px;

overflow-x:hidden;

}

/* Banner */

.banner{

width:100%;

overflow:hidden;

background:#000;

}

.banner img{

width:100%;

display:block;

border-bottom:3px solid #f39c12;

}

/* Back Button */

.back-btn{

margin:20px;

display:inline-flex;

align-items:center;

gap:10px;

padding:12px 20px;

background:#f39c12;

color:#111;

text-decoration:none;

font-weight:bold;

border-radius:30px;

transition:.3s;

}

.back-btn:hover{

background:#ffb84d;

transform:translateX(-3px);

}

/* Container */

.container{

max-width:900px;

margin:auto;

padding:20px;

}

.header{

text-align:center;

margin-bottom:25px;

}

.header h1{

font-size:32px;

color:#f39c12;

margin-bottom:10px;

}

.header p{

color:#bbb;

}

/* Search */

.search-box{

margin-bottom:25px;

display:flex;

align-items:center;

background:#1c1c1c;

border:2px solid #333;

border-radius:15px;

padding:15px;

transition:.3s;

}

.search-box:hover{

border-color:#f39c12;

}

.search-box input{

width:100%;

background:none;

border:none;

outline:none;

color:white;

font-size:16px;

}

.search-box input::placeholder{

color:#999;

}
/* Orders */

.order-card{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:20px;

margin-bottom:20px;

box-shadow:0 8px 20px rgba(0,0,0,.25);

transition:.3s;

}

.order-card:hover{

border-color:#f39c12;

transform:translateY(-3px);

}

.order-top{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;

flex-wrap:wrap;

gap:10px;

}

.order-id{

font-size:22px;

font-weight:bold;

color:#f39c12;

}

.order-date{

color:#bbb;

font-size:14px;

}

.order-info{

margin:10px 0;

line-height:1.8;

color:#ddd;

font-size:15px;

}

.order-total{

font-size:24px;

font-weight:bold;

color:#2ecc71;

margin-top:12px;

}

.status{

display:inline-block;

padding:8px 16px;

border-radius:20px;

font-size:14px;

font-weight:bold;

}

.pending{

background:#6b4d00;

color:#ffc107;

}

.processing{

background:#0d47a1;

color:#90caf9;

}

.delivered{

background:#1b5e20;

color:#8bc34a;

}

.cancelled{

background:#7f0000;

color:#ef9a9a;

}

/* Empty */

.empty{

text-align:center;

padding:60px 20px;

color:#bbb;

}

.empty span{

display:block;

font-size:70px;

margin-bottom:20px;

}

/* Bottom Navigation */

.bottom-nav{

position:fixed;

left:0;

right:0;

bottom:0;

height:72px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:2px solid #f39c12;

box-shadow:0 -2px 15px rgba(0,0,0,.45);

z-index:999;

}

.bottom-nav a{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-decoration:none;

color:#ddd;

font-size:13px;

font-weight:bold;

transition:.3s;

}

.bottom-nav a div{

font-size:22px;

margin-bottom:4px;

}

.bottom-nav a.active{

color:#f39c12;

}

.bottom-nav a:hover{

color:#f39c12;

transform:translateY(-3px);

}
/* Animation */

.fade{

animation:fadeIn .8s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.order-top{

flex-direction:column;

align-items:flex-start;

}

.header h1{

font-size:28px;

}

}

</style>

</head>

<body class="fade">

<!-- Banner -->

<div class="banner">

<img

src="images/Banner.jpeg"

alt="SLV Banner">

</div>

<!-- Back Button -->

<a

href="customer-profile.html"

class="back-btn">

⬅ Back

</a>

<div class="container">

<div class="header">

<h1>

📦 My Orders

</h1>

<p>

Track all your SLV Stores orders

</p>

</div>

<div class="search-box">

<input

type="text"

id="searchBox"

placeholder="🔍 Search Order Number..."

onkeyup="searchOrders()">

</div>

<div

id="ordersContainer">

</div>

</div>

<script>

const phone=

localStorage.getItem(

"customerPhone"

)||

localStorage.getItem(

"customerMobile"

)||"";

async function loadOrders(){

try{

const response=

await fetch(

`https://obtain-handles-creator-morning.trycloudflare.com/orders/${phone}`

);

const orders=

await response.json();

if(orders.length===0){

document.getElementById(

"ordersContainer"

).innerHTML=

`

<div class="empty">

<span>

📦

</span>

No Orders Found

</div>

`;

return;

}

let html="";

orders.forEach(order=>{

html+=`

<div class="order-card">

<div class="order-top">

<div class="order-id">

Order #${order.id}

</div>

<div class="order-date">

${new Date(order.created_at).toLocaleString()}

</div>

</div>

<div class="order-info">

<b>Customer :</b>

${order.customer_name}<br>

<b>Mobile :</b>

${order.phone}<br>

<b>Address :</b>

${order.address}

</div>

<div class="order-total">

₹${Number(order.grand_total).toFixed(2)}

</div>

<br>

<span class="status ${String(order.status).toLowerCase()}">

${order.status}

</span>

</div>

`;

});

document.getElementById(

"ordersContainer"

).innerHTML=

html;

}

catch(error){

console.log(error);

document.getElementById(

"ordersContainer"

).innerHTML=

`

<div class="empty">

<span>

❌

</span>

Failed To Load Orders

</div>

`;

}

}
function searchOrders(){

const value=

document.getElementById(

"searchBox"

).value

.toLowerCase();

const cards=

document.querySelectorAll(

".order-card"

);

cards.forEach(card=>{

const text=

card.innerText

.toLowerCase();

if(text.includes(value)){

card.style.display="block";

}

else{

card.style.display="none";

}

});

}

loadOrders();

</script>

<!-- Bottom Navigation -->

<div class="bottom-nav">

<a
href="customer-home.html">

<div>

🏠

</div>

<span>

Home

</span>

</a>

<a
href="categories.html">

<div>

📂

</div>

<span>

Categories

</span>

</a>

<a
href="customer-cart.html">

<div>

</div>

<span>

Cart

</span>

</a>

<a
href="customer-profile.html">

<div>

👤

</div>

<span>

Profile

</span>

</a>

<a
href="my-orders.html"
class="active">

<div>

📦

</div>

<span>

Orders

</span>

</a>

</div>

</body>

</html>
