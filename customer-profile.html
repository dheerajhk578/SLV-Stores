<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores - My Profile

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:#111;

color:white;

padding-bottom:90px;

overflow-x:hidden;

}

/* Banner */

.banner{

width:100%;

overflow:hidden;

background:#000;

}

.banner img{

width:100%;

display:block;

border-bottom:3px solid #f39c12;

}

/* Back Button */

.back-btn{

margin:20px;

display:inline-flex;

align-items:center;

gap:10px;

padding:12px 20px;

background:#f39c12;

color:#111;

text-decoration:none;

font-weight:bold;

border-radius:30px;

transition:.3s;

}

.back-btn:hover{

background:#ffb84d;

transform:translateX(-3px);

}

/* Container */

.container{

max-width:700px;

margin:auto;

padding:20px;

}

.profile-card{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:0 8px 20px rgba(0,0,0,.25);

}

.profile-image{

width:120px;

height:120px;

border-radius:50%;

background:#2b2b2b;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

margin:auto;

margin-bottom:20px;

border:3px solid #f39c12;

}

.profile-card h1{

color:#f39c12;

margin-bottom:10px;

font-size:30px;

}

.profile-card p{

color:#ccc;

margin-bottom:25px;

}

input{

width:100%;

padding:14px;

margin-bottom:15px;

border:none;

outline:none;

border-radius:12px;

background:#2b2b2b;

color:white;

font-size:15px;

}

textarea{

width:100%;

height:120px;

padding:14px;

border:none;

outline:none;

border-radius:12px;

background:#2b2b2b;

color:white;

font-size:15px;

resize:none;

margin-bottom:20px;

}
/* Action Buttons */

.button-group{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

margin-top:20px;

}

.save-btn{

padding:15px;

border:none;

border-radius:12px;

background:#f39c12;

color:#111;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.save-btn:hover{

background:#ffb84d;

}

.orders-btn{

padding:15px;

border:none;

border-radius:12px;

background:#3498db;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.orders-btn:hover{

background:#2980b9;

}

/* Quick Actions */

.quick-actions{

margin-top:25px;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}

.action-card{

background:#252525;

border:2px solid #333;

border-radius:15px;

padding:18px;

text-align:center;

cursor:pointer;

transition:.3s;

}

.action-card:hover{

border-color:#f39c12;

transform:translateY(-4px);

}

.action-card div{

font-size:36px;

margin-bottom:10px;

}

.action-card h3{

color:#f39c12;

margin-bottom:6px;

font-size:17px;

}

.action-card p{

color:#bbb;

font-size:13px;

line-height:1.4;

}

/* Bottom Navigation */

.bottom-nav{

position:fixed;

left:0;

right:0;

bottom:0;

height:72px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:2px solid #f39c12;

box-shadow:0 -2px 15px rgba(0,0,0,.45);

z-index:999;

}

.bottom-nav a{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-decoration:none;

color:#ddd;

font-size:13px;

font-weight:bold;

transition:.3s;

}

.bottom-nav a div{

font-size:22px;

margin-bottom:4px;

}

.bottom-nav a:hover{

color:#f39c12;

transform:translateY(-3px);

}

.bottom-nav a.active{

color:#f39c12;

}

.fade{

animation:fadeIn .8s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.button-group{

grid-template-columns:1fr;

}

.quick-actions{

grid-template-columns:1fr;

}

.profile-image{

width:100px;

height:100px;

font-size:50px;

}

}

</style>

</head>

<body class="fade">

<!-- Banner -->

<div class="banner">

<img

src="images/banner.jpeg"

alt="SLV Banner">

</div>

<!-- Back Button -->

<a

href="customer-home.html"

class="back-btn">

⬅ Back

</a>

<div class="container">

<div class="profile-card">

<div class="profile-image">

👤

</div>

<h1>

My Profile

</h1>

<p>

Manage your personal information

</p>

<input

type="text"

id="customerName"

placeholder="Customer Name">

<input

type="tel"

id="customerMobile"

placeholder="Mobile Number">

<textarea

id="customerAddress"

placeholder="Full Delivery Address">

</textarea>

<div class="button-group">

<button

class="save-btn"

onclick="saveProfile()">

💾 Save Profile

</button>

<button

class="orders-btn"

onclick="window.location.href='my-orders.html'">

📦 My Orders

</button>

</div>

<div class="quick-actions">
    <div

class="action-card"

onclick="window.location.href='customer-cart.html'">

<div>

🛒

</div>

<h3>

My Cart

</h3>

<p>

View and manage your shopping cart.

</p>

</div>

<div

class="action-card"

onclick="window.location.href='categories.html'">

<div>

🛍

</div>

<h3>

Shop Now

</h3>

<p>

Browse all grocery categories.

</p>

</div>

<div

class="action-card"

onclick="window.location.href='my-orders.html'">

<div>

📦

</div>

<h3>

Order History

</h3>

<p>

View all your previous orders.

</p>

</div>

<div

class="action-card"

onclick="window.open('tel:9481692336')">

<div>

📞

</div>

<h3>

Contact Store

</h3>

<p>

Call SLV Stores directly.

</p>

</div>

</div>

</div>

</div>

<script>

function saveProfile(){

localStorage.setItem(

"customerName",

document.getElementById(

"customerName"

).value

);

localStorage.setItem(

"customerMobile",

document.getElementById(

"customerMobile"

).value

);

localStorage.setItem(

"customerPhone",

document.getElementById(

"customerMobile"

).value

);

localStorage.setItem(

"customerAddress",

document.getElementById(

"customerAddress"

).value

);

alert(

"Profile Saved Successfully"

);

}

function loadProfile(){

document.getElementById(

"customerName"

).value=

localStorage.getItem(

"customerName"

)||"";

document.getElementById(

"customerMobile"

).value=

localStorage.getItem(

"customerMobile"

)||

localStorage.getItem(

"customerPhone"

)||"";

document.getElementById(

"customerAddress"

).value=

localStorage.getItem(

"customerAddress"

)||"";

}

loadProfile();

</script>

<!-- Bottom Navigation -->

<div class="bottom-nav">

<a
href="customer-home.html">

<div>

🏠

</div>

<span>

Home

</span>

</a>

<a
href="categories.html">

<div>

📂

</div>

<span>

Categories

</span>

</a>

<a
href="customer-cart.html">

<div>

🛒

</div>

<span>

Cart

</span>

</a>

<a
href="customer-profile.html"
class="active">

<div>

👤

</div>

<span>

Profile

</span>

</a>

<a
href="my-orders.html">

<div>

📦

</div>

<span>

Orders

</span>

</a>

</div>

</body>

</html>
