<!DOCTYPE html>
<html>
<head>
<title>Low Stock</title>

<style>
body{
font-family:Arial;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:red;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ccc;
}
</style>

</head>

<body>

<h2>Low Stock Products</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Product</th>
<th>Stock</th>
</tr>
</thead>

<tbody id="stockTable"></tbody>

</table>

<script>

fetch('https://obtain-handles-creator-morning.trycloudflare.com/low-stock')
.then(res=>res.json())
.then(data=>{

let rows='';

data.forEach(item=>{

rows+=`
<tr>
<td>${item.id}</td>
<td>${item.product_name}</td>
<td>${item.stock_quantity}</td>
</tr>
`;

});

document.getElementById(
'stockTable'
).innerHTML=rows;

});

</script>

</body>
</html>
