<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

body{

background:#111;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

color:white;

}

.splash{

text-align:center;

animation:fadeIn 1s ease;

}

.logo{

width:180px;

height:180px;

border-radius:50%;

background:white;

padding:12px;

box-shadow:0 0 25px rgba(243,156,18,.6);

}

.store-name{

margin-top:25px;

font-size:34px;

font-weight:bold;

color:#f39c12;

letter-spacing:2px;

}

.tagline{

margin-top:10px;

font-size:18px;

color:#ddd;

}

.location{

margin-top:8px;

font-size:16px;

color:#2ecc71;

font-weight:bold;

}

.loading{

margin-top:35px;

font-size:18px;

color:#f5b041;

}

.dots span{

animation:blink 1.4s infinite;

font-size:28px;

}

.dots span:nth-child(2){

animation-delay:.2s;

}

.dots span:nth-child(3){

animation-delay:.4s;

}

@keyframes blink{

0%{opacity:.2;}

50%{opacity:1;}

100%{opacity:.2;}

}

@keyframes fadeIn{

from{

opacity:0;

transform:scale(.95);

}

to{

opacity:1;

transform:scale(1);

}

}

</style>

</head>

<body>

<div class="splash">

<img

src="images/logo.jpeg"

class="logo"

alt="SLV Logo">

<h1 class="store-name">

SLV STORES

</h1>

<p class="tagline">

Fresh • Quality • Trust

</p>

<p class="location">

📍 Turuvekere

</p>

<div class="loading">

Loading

<div class="dots">

<span>.</span>

<span>.</span>

<span>.</span>

</div>

</div>

</div>
<script>

/* Fade Out Animation */

setTimeout(()=>{

document.body.style.transition="opacity .6s";

document.body.style.opacity="0";

},1500);

/* Open Home Page */

setTimeout(()=>{

window.location.href="customer-home.html";

},2100);

</script>

</body>

</html>
