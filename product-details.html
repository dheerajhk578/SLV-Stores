<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores - Product Details

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:#111;

color:white;

padding-bottom:90px;

overflow-x:hidden;

}

/* Banner */

.banner{

width:100%;

overflow:hidden;

background:#000;

}

.banner img{

width:100%;

display:block;

border-bottom:3px solid #f39c12;

}

/* Back Button */

.back-btn{

margin:20px;

display:inline-flex;

align-items:center;

gap:10px;

padding:12px 20px;

background:#f39c12;

color:#111;

text-decoration:none;

font-weight:bold;

border-radius:30px;

transition:.3s;

}

.back-btn:hover{

background:#ffb84d;

transform:translateX(-3px);

}

/* Container */

.container{

max-width:700px;

margin:auto;

padding:20px;

}

.card{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:25px;

box-shadow:0 8px 20px rgba(0,0,0,.3);

}

.product-image{

width:100%;

height:280px;

background:white;

border-radius:15px;

object-fit:contain;

padding:10px;

margin-bottom:20px;

}

h1{

color:#f39c12;

font-size:28px;

margin-bottom:15px;

text-align:center;

}

.info{

margin-bottom:12px;

color:#ddd;

font-size:16px;

line-height:1.6;

}

.info b{

color:white;

}
/* Price */

.price{

font-size:30px;

font-weight:bold;

color:#2ecc71;

margin:20px 0;

text-align:center;

}

/* Quantity */

.qty-section{

margin-top:25px;

}

.qty-title{

font-size:17px;

margin-bottom:12px;

color:#f39c12;

}

.qty-box{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-bottom:20px;

}

.qty-box button{

width:50px;

height:50px;

border:none;

border-radius:12px;

background:#f39c12;

color:#111;

font-size:22px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.qty-box button:hover{

background:#ffb84d;

transform:scale(1.05);

}

.qty-box input{

width:100px;

height:50px;

text-align:center;

border:none;

border-radius:12px;

background:#2a2a2a;

color:white;

font-size:18px;

}

#unitText{

font-size:18px;

font-weight:bold;

color:#ddd;

}

/* Total */

.total-box{

margin:25px 0;

padding:18px;

background:#222;

border-radius:15px;

border:1px solid #333;

text-align:center;

}

.total-title{

font-size:16px;

color:#bbb;

margin-bottom:8px;

}

#totalPrice{

font-size:30px;

font-weight:bold;

color:#2ecc71;

}

/* Buttons */

.button-group{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

margin-top:20px;

}

.cart-btn{

padding:15px;

border:none;

border-radius:12px;

background:#f39c12;

color:#111;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.cart-btn:hover{

background:#ffb84d;

}

.buy-btn{

padding:15px;

border:none;

border-radius:12px;

background:#2ecc71;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.buy-btn:hover{

background:#27ae60;

}

.fade{

animation:fadeIn .8s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}
@media(max-width:480px){

.container{

padding:15px;

}

.card{

padding:20px;

}

.product-image{

height:220px;

}

h1{

font-size:24px;

}

.price{

font-size:26px;

}

.button-group{

grid-template-columns:1fr;

}

.qty-box{

gap:10px;

}

.qty-box button{

width:45px;

height:45px;

}

.qty-box input{

width:90px;

height:45px;

}

}

</style>

</head>

<body class="fade">

<!-- Banner -->

<div class="banner">

<img

src="images/Banner.jpeg"

alt="SLV Banner">

</div>

<!-- Back Button -->

<a

href="variants.html"

class="back-btn">

⬅ Back

</a>

<div class="container">

<div class="card">

<img

id="productImage"

class="product-image"

src="images/no-image.png"

alt="Product Image">

<h1 id="productName">

Loading...

</h1>

<div class="info">

<b>Brand :</b>

<span id="brand">

</span>

</div>

<div class="info">

<b>Variant :</b>

<span id="variant">

</span>

</div>

<div class="info">

<b>Pack Size :</b>

<span id="packSize">

</span>

</div>

<div class="info">

<b>Category :</b>

<span id="category">

</span>

</div>

<div class="info">

<b>Description :</b>

<p id="description">

</p>

</div>

<div

class="price"

id="price">

₹0

</div>

<div class="qty-section">

<div class="qty-title">

Select Quantity

</div>

<div class="qty-box">

<button

onclick="decreaseQty()">

−

</button>

<input

type="number"

id="qty"

value="1"

step="0.25"

min="0.25">

<span

id="unitText">

Kg

</span>

<button

onclick="increaseQty()">

+

</button>

</div>

</div>

<div class="total-box">

<div class="total-title">

Total Amount

</div>

<div

id="totalPrice">

₹0

</div>

</div>

<div class="button-group">

<button

class="cart-btn"

onclick="addToCart()">

🛒 Add To Cart

</button>

<button

class="buy-btn"

onclick="buyNow()">

⚡ Buy Now

</button>

</div>

</div>

</div>
<script>

const params=

new URLSearchParams(

window.location.search

);

const productId=

params.get("id");

let currentProduct=null;

async function loadProduct(){

try{

const response=

await fetch(

`https://obtain-handles-creator-morning.trycloudflare.com/products/${productId}`

);

const product=

await response.json();

currentProduct=product;

document.getElementById(

"productName"

).innerText=

product.product_name;

document.getElementById(

"brand"

).innerText=

product.brand || "SLV Stores";

document.getElementById(

"variant"

).innerText=

product.variant_name || "Standard";

document.getElementById(

"packSize"

).innerText=

product.pack_size || "-";

document.getElementById(

"category"

).innerText=

product.main_category || "-";

document.getElementById(

"description"

).innerText=

product.description ||

"No description available.";

document.getElementById(

"productImage"

).src=

product.product_image

?

`http://localhost:5000/uploads/${product.product_image}`

:

"images/no-image.png";

document.getElementById(

"productImage"

).onerror=function(){

this.src="images/no-image.png";

};

document.getElementById(

"unitText"

).innerText=

product.unit || "Nos";

if(product.mode==="loose"){

document.getElementById(

"price"

).innerText=

`₹${Number(product.retail_price).toFixed(2)} / Kg`;

document.getElementById(

"qty"

).step="0.25";

}

else{

document.getElementById(

"price"

).innerText=

`₹${Number(product.retail_price).toFixed(2)}`;

document.getElementById(

"qty"

).step="1";

document.getElementById(

"qty"

).value=1;

}

updateTotal();

}

catch(error){

console.error(error);

alert(

"Failed To Load Product"

);

}

}

function increaseQty(){

const qty=

document.getElementById(

"qty"

);

const step=

parseFloat(qty.step);

qty.value=

(parseFloat(qty.value||0)+step)

.toFixed(step===1?0:2);

updateTotal();

}

function decreaseQty(){

const qty=

document.getElementById(

"qty"

);

const step=

parseFloat(qty.step);

let value=

parseFloat(qty.value||0)-step;

if(value<step){

value=step;

}

qty.value=

value.toFixed(step===1?0:2);

updateTotal();

}

function updateTotal(){

if(!currentProduct){

return;

}

const qty=

parseFloat(

document.getElementById(

"qty"

).value

)||0;

const total=

qty*

Number(

currentProduct.retail_price

);

document.getElementById(

"totalPrice"

).innerText=

`₹${total.toFixed(2)}`;

}

document.getElementById(

"qty"

).addEventListener(

"input",

updateTotal

);
function addToCart(){

let cart=

JSON.parse(

localStorage.getItem("cart")

)||[];

const existing=

cart.find(item=>

item.productId===currentProduct.id

);

const qty=

parseFloat(

document.getElementById(

"qty"

).value

);

if(existing){

existing.quantity+=qty;

}

else{

cart.push({

productId:currentProduct.id,

product_name:currentProduct.product_name,

brand:currentProduct.brand,

variant_name:currentProduct.variant_name,

pack_size:currentProduct.pack_size,

retail_price:currentProduct.retail_price,

product_image:currentProduct.product_image,

unit:currentProduct.unit,

quantity:qty

});

}

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

alert(

"Product Added To Cart"

);

}

function buyNow(){

addToCart();

window.location.href=

"customer-cart.html";

}

/* Card Animation */

window.addEventListener(

"load",

()=>{

document.querySelector(

".card"

).style.opacity="0";

document.querySelector(

".card"

).style.transform="translateY(30px)";

setTimeout(()=>{

document.querySelector(

".card"

).style.transition=".6s";

document.querySelector(

".card"

).style.opacity="1";

document.querySelector(

".card"

).style.transform="translateY(0px)";

},150);

});

loadProduct();

</script>

</body>

</html>
