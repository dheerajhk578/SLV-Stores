<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores - My Cart

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:#111;

color:white;

padding-bottom:90px;

overflow-x:hidden;

}

/* Banner */

.banner{

width:100%;

overflow:hidden;

background:#000;

}

.banner img{

width:100%;

display:block;

border-bottom:3px solid #f39c12;

}

/* Back Button */

.back-btn{

margin:20px;

display:inline-flex;

align-items:center;

gap:10px;

padding:12px 20px;

background:#f39c12;

color:#111;

text-decoration:none;

font-weight:bold;

border-radius:30px;

transition:.3s;

}

.back-btn:hover{

background:#ffb84d;

transform:translateX(-3px);

}

/* Container */

.container{

max-width:900px;

margin:auto;

padding:20px;

}

h1{

text-align:center;

color:#f39c12;

margin-bottom:20px;

font-size:32px;

}

/* Customer Details */

.section{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:20px;

margin-bottom:25px;

box-shadow:0 8px 20px rgba(0,0,0,.25);

}

.section h2{

color:#f39c12;

margin-bottom:15px;

}

input,

textarea{

width:100%;

padding:14px;

margin-bottom:15px;

border:none;

outline:none;

border-radius:12px;

background:#2b2b2b;

color:white;

font-size:15px;

}

textarea{

height:100px;

resize:none;

}
/* Cart Items */

.cart-item{

display:flex;

gap:18px;

align-items:center;

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:18px;

margin-bottom:18px;

transition:.3s;

box-shadow:0 8px 20px rgba(0,0,0,.25);

}

.cart-item:hover{

border-color:#f39c12;

transform:translateY(-3px);

}

.cart-image{

width:110px;

height:110px;

background:white;

border-radius:15px;

object-fit:contain;

padding:8px;

}

.cart-details{

flex:1;

}

.cart-details h3{

color:#f39c12;

font-size:20px;

margin-bottom:8px;

}

.cart-details p{

color:#ddd;

font-size:14px;

margin-bottom:6px;

}

.item-total{

font-size:18px;

font-weight:bold;

color:#2ecc71;

margin-top:8px;

}

/* Quantity */

.qty-box{

display:flex;

align-items:center;

gap:10px;

margin-top:12px;

}

.qty-btn{

width:38px;

height:38px;

border:none;

border-radius:10px;

background:#f39c12;

color:#111;

font-size:20px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.qty-btn:hover{

background:#ffb84d;

}

.qty-value{

width:70px;

text-align:center;

background:#2b2b2b;

padding:10px;

border-radius:10px;

}

/* Buttons */

.remove-btn{

margin-top:15px;

padding:10px 18px;

border:none;

border-radius:10px;

background:#e74c3c;

color:white;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.remove-btn:hover{

background:#c0392b;

}

.summary{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:20px;

margin-top:20px;

box-shadow:0 8px 20px rgba(0,0,0,.25);

}

.summary h2{

color:#f39c12;

margin-bottom:15px;

}

.total{

font-size:30px;

font-weight:bold;

color:#2ecc71;

text-align:center;

margin:20px 0;

}

.action-buttons{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

margin-top:20px;

}

.shopping{

background:#3498db;

color:white;

}

.clear{

background:#555;

color:white;

}

.order{

background:#25D366;

color:white;

font-weight:bold;

}

.action-buttons button{

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.action-buttons button:hover{

transform:translateY(-2px);

opacity:.9;

}

.empty{

text-align:center;

padding:60px 20px;

font-size:22px;

color:#bbb;

}

.empty span{

display:block;

font-size:70px;

margin-bottom:20px;

}
/* Bottom Navigation */

.bottom-nav{

position:fixed;

left:0;

right:0;

bottom:0;

height:72px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:2px solid #f39c12;

box-shadow:0 -2px 15px rgba(0,0,0,.45);

z-index:999;

}

.bottom-nav a{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-decoration:none;

color:#ddd;

font-size:13px;

font-weight:bold;

transition:.3s;

}

.bottom-nav a div{

font-size:22px;

margin-bottom:4px;

}

.bottom-nav a:hover{

color:#f39c12;

transform:translateY(-3px);

}

.bottom-nav a.active{

color:#f39c12;

}

/* Animation */

.fade{

animation:fadeIn .8s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.cart-item{

flex-direction:column;

text-align:center;

}

.cart-image{

width:140px;

height:140px;

}

.action-buttons{

grid-template-columns:1fr;

}

.qty-box{

justify-content:center;

}

}

</style>

</head>

<body class="fade">

<!-- Banner -->

<div class="banner">

<img

src="images/banner.jpeg"

alt="SLV Banner">

</div>

<!-- Back Button -->

<a

href="categories.html"

class="back-btn">

⬅ Back

</a>

<div class="container">

<h1>

🛒 My Cart

</h1>

<div class="section">

<h2>

Customer Details

</h2>

<input

type="text"

id="customerName"

placeholder="Customer Name">

<input

type="tel"

id="customerPhone"

placeholder="Mobile Number">

<textarea

id="customerAddress"

placeholder="Delivery Address">

</textarea>

</div>

<div

id="cartContainer">

</div>

<div class="summary">

<h2>

Order Summary

</h2>

<div

class="total"

id="grandTotal">

₹0.00

</div>

<div class="action-buttons">

<button

class="shopping"

onclick="continueShopping()">

🛍 Continue Shopping

</button>

<button

class="clear"

onclick="clearCart()">

🗑 Clear Cart

</button>

<button

class="order"

onclick="placeOrder()">

📲 Place Order

</button>

</div>

</div>

</div>
<script>

let cart=

JSON.parse(

localStorage.getItem("cart")

)||[];

loadSavedCustomer();

loadCart();

function loadSavedCustomer(){

document.getElementById(

"customerName"

).value=

localStorage.getItem(

"customerName"

)||"";

document.getElementById(

"customerPhone"

).value=

localStorage.getItem(

"customerPhone"

)||"";

document.getElementById(

"customerAddress"

).value=

localStorage.getItem(

"customerAddress"

)||"";

}

function saveCustomer(){

localStorage.setItem(

"customerName",

document.getElementById(

"customerName"

).value

);

localStorage.setItem(

"customerPhone",

document.getElementById(

"customerPhone"

).value

);

localStorage.setItem(

"customerAddress",

document.getElementById(

"customerAddress"

).value

);

}

function loadCart(){

if(cart.length===0){

document.getElementById(

"cartContainer"

).innerHTML=

`

<div class="empty">

<span>

🛒

</span>

Your Cart Is Empty

</div>

`;

document.getElementById(

"grandTotal"

).innerText="₹0.00";

return;

}

let html="";

let grandTotal=0;

cart.forEach((item,index)=>{

const qty=

Number(item.quantity);

const price=

Number(item.retail_price);

const total=

qty*price;

grandTotal+=total;

html+=`

<div class="cart-item">

<img

class="cart-image"

src="${
item.product_image

?

'https://obtain-handles-creator-morning.trycloudflare.com/uploads/'+item.product_image

:

'images/no-image.png'

}"

onerror="this.src='images/no-image.png'">

<div class="cart-details">

<h3>

${item.product_name}

</h3>

<p>

Brand :

${item.brand || "SLV Stores"}

</p>

<p>

Variant :

${item.variant_name || "-"}

</p>

<p>

Pack Size :

${item.pack_size || "-"}

</p>

<p>

Price :

₹${price.toFixed(2)}

</p>

<div class="qty-box">

<button

class="qty-btn"

onclick="changeQty(${index},-1)">

−

</button>

<div class="qty-value">

${qty}

</div>

<button

class="qty-btn"

onclick="changeQty(${index},1)">

+

</button>

</div>

<div class="item-total">

₹${total.toFixed(2)}

</div>

<button

class="remove-btn"

onclick="removeItem(${index})">

Remove

</button>

</div>

</div>

`;

});

document.getElementById(

"cartContainer"

).innerHTML=html;

document.getElementById(

"grandTotal"

).innerText=

"₹"+grandTotal.toFixed(2);

}
function changeQty(index,value){

cart[index].quantity=

Number(cart[index].quantity)+value;

if(cart[index].quantity<1){

cart[index].quantity=1;

}

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

loadCart();

}

function removeItem(index){

if(confirm(

"Remove this product from cart?"

)){

cart.splice(index,1);

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

loadCart();

}

}

function clearCart(){

if(confirm(

"Clear entire cart?"

)){

cart=[];

localStorage.removeItem(

"cart"

);

loadCart();

}

}

function continueShopping(){

window.location.href=

"categories.html";

}

function placeOrder(){

if(cart.length===0){

alert(

"Your cart is empty."

);

return;

}

saveCustomer();

const name=

document.getElementById(

"customerName"

).value.trim();

const phone=

document.getElementById(

"customerPhone"

).value.trim();

const address=

document.getElementById(

"customerAddress"

).value.trim();

if(

name==="" ||

phone==="" ||

address===""

){

alert(

"Please fill all customer details."

);

return;

}

let grandTotal=0;

let message=

"🛒 *SLV STORES ORDER*%0A%0A";

message+=

"*Customer:* "+name+"%0A";

message+=

"*Mobile:* "+phone+"%0A";

message+=

"*Address:* "+address+"%0A%0A";

message+=

"----------------------------%0A";

cart.forEach(item=>{

const total=

Number(item.retail_price)*

Number(item.quantity);

grandTotal+=total;

message+=

"📦 "+item.product_name+"%0A";

message+=

"Brand : "+(item.brand||"SLV Stores")+"%0A";

message+=

"Variant : "+(item.variant_name||"-")+"%0A";

message+=

"Qty : "+item.quantity+" "+(item.unit||"Nos")+"%0A";

message+=

"Price : ₹"+Number(item.retail_price).toFixed(2)+"%0A";

message+=

"Total : ₹"+total.toFixed(2)+"%0A";

message+=

"----------------------------%0A";

});

message+=

"%0A*Grand Total : ₹"+

grandTotal.toFixed(2)+"*";

const orderData={

customer_name:name,

phone:phone,

address:address,

order_details:decodeURIComponent(message),

grand_total:grandTotal

};

fetch(

"https://obtain-handles-creator-morning.trycloudflare.com/orders",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(orderData)

}

)

.then(response=>response.json())

.then(data=>{

window.open(

"https://wa.me/919481692336?text="+message,

"_blank"

);

localStorage.removeItem(

"cart"

);

cart=[];

loadCart();

})

.catch(error=>{

console.log(error);

alert(

"Failed To Save Order"

);

});

}

</script>

<!-- Bottom Navigation -->

<div class="bottom-nav">

<a href="customer-home.html">

<div>🏠</div>

<span>Home</span>

</a>

<a href="categories.html">

<div>📂</div>

<span>Categories</span>

</a>

class="active">

<div>🛒</div>

<span>Cart</span>

</a>

<a href="customer-profile.html">

<div>👤</div>

<span>Profile</span>

</a>

<a href="my-orders.html">

<div>📦</div>

<span>Orders</span>

</a>

</div>

</body>

</html>
