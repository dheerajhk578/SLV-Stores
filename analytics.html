<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores - Analytics

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

html{

scroll-behavior:smooth;

}

body{

background:#111;

color:white;

padding:20px;

padding-bottom:40px;

overflow-x:hidden;

}

/* Header */

.header{

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:15px;

margin-bottom:25px;

}

.logo{

font-size:32px;

font-weight:bold;

color:#f39c12;

}

.back-btn{

padding:12px 20px;

background:#f39c12;

color:#111;

text-decoration:none;

font-weight:bold;

border-radius:10px;

transition:.3s;

}

.back-btn:hover{

background:#ffb84d;

}

/* Search */

.search-box{

margin-bottom:25px;

}

.search-box input{

width:100%;

padding:15px;

background:#1c1c1c;

border:2px solid #333;

border-radius:15px;

outline:none;

color:white;

font-size:16px;

transition:.3s;

}

.search-box input:focus{

border-color:#f39c12;

}

/* Statistics */

.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:18px;

margin-bottom:25px;

}

.stat-card{

background:#1c1c1c;

border:2px solid #333;

border-radius:18px;

padding:22px;

text-align:center;

transition:.3s;

}

.stat-card:hover{

border-color:#f39c12;

transform:translateY(-5px);

}

.stat-card h3{

color:#f39c12;

margin-bottom:10px;

}

.stat-card h2{

font-size:30px;

}
/* Analytics Sections */

.analytics-card{

background:#1c1c1c;

border:2px solid #333;

border-radius:20px;

padding:20px;

margin-bottom:25px;

box-shadow:0 10px 20px rgba(0,0,0,.25);

}

.analytics-card h2{

color:#f39c12;

margin-bottom:20px;

}

/* Tables */

.table-container{

overflow-x:auto;

}

table{

width:100%;

min-width:900px;

border-collapse:collapse;

}

thead{

background:#f39c12;

color:#111;

}

th{

padding:15px;

text-align:center;

font-size:15px;

}

td{

padding:14px;

text-align:center;

border-bottom:1px solid #333;

color:#ddd;

}

tbody tr:hover{

background:#252525;

}

/* Progress Bars */

.progress-item{

margin-bottom:18px;

}

.progress-item span{

display:flex;

justify-content:space-between;

margin-bottom:8px;

font-weight:bold;

}

.progress{

height:12px;

background:#2b2b2b;

border-radius:10px;

overflow:hidden;

}

.progress div{

height:100%;

background:#f39c12;

border-radius:10px;

}

/* Buttons */

.button-group{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-top:20px;

}

.print-btn{

padding:14px 22px;

border:none;

border-radius:12px;

background:#3498db;

color:white;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.export-btn{

padding:14px 22px;

border:none;

border-radius:12px;

background:#2ecc71;

color:white;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.print-btn:hover{

background:#2980b9;

}

.export-btn:hover{

background:#27ae60;

}
/* Animation */

.fade{

animation:fadeIn .8s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.header{

flex-direction:column;

align-items:flex-start;

}

.stats{

grid-template-columns:repeat(2,1fr);

}

.button-group{

flex-direction:column;

}

}

@media(max-width:480px){

.stats{

grid-template-columns:1fr;

}

.logo{

font-size:28px;

}

}

</style>

</head>

<body class="fade">

<script>

if(!sessionStorage.getItem("loggedIn")){

window.location.href="login.html";

}

</script>

<div class="header">

<div class="logo">

📊 Sales Analytics

</div>

<a

href="dashboard.html"

class="back-btn">

⬅ Dashboard

</a>

</div>

<div class="search-box">

<input

type="text"

id="searchInput"

placeholder="🔍 Search Analytics..."

>

</div>

<div class="stats">

<div class="stat-card">

<h3>Total Revenue</h3>

<h2 id="revenue">

₹0.00

</h2>

</div>

<div class="stat-card">

<h3>Total Orders</h3>

<h2 id="orders">

0

</h2>

</div>

<div class="stat-card">

<h3>Delivered Orders</h3>

<h2 id="delivered">

0

</h2>

</div>

<div class="stat-card">

<h3>Pending Orders</h3>

<h2 id="pending">

0

</h2>

</div>

<div class="stat-card">

<h3>Today's Sales</h3>

<h2 id="todaySales">

₹0.00

</h2>

</div>

<div class="stat-card">

<h3>Monthly Sales</h3>

<h2 id="monthlySales">

₹0.00

</h2>

</div>

</div>

<div class="analytics-card">

<h2>

🏆 Top Selling Products

</h2>

<div class="table-container">

<table>

<thead>

<tr>

<th>Product</th>

<th>Quantity Sold</th>

</tr>

</thead>

<tbody id="topProductsBody">

<tr>

<td colspan="2">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<div class="analytics-card">

<h2>

📦 Order Status

</h2>

<div class="progress-item">

<span>

Pending

<b id="pendingPercent">

0%

</b>

</span>

<div class="progress">

<div id="pendingBar" style="width:0%;"></div>

</div>

</div>

<div class="progress-item">

<span>

Delivered

<b id="deliveredPercent">

0%

</b>

</span>

<div class="progress">

<div id="deliveredBar" style="width:0%;"></div>

</div>

</div>

</div>

<div class="button-group">

<button

class="print-btn"

onclick="window.print()">

🖨 Print Analytics

</button>

<button

class="export-btn">

📥 Export CSV

</button>

</div>
<script>

async function loadAnalytics(){

try{

const response=

await fetch(

"http://localhost:5000/analytics"

);

const data=

await response.json();

document.getElementById(

"revenue"

).innerText=

"₹"+

Number(data.total_revenue||0)

.toFixed(2);

document.getElementById(

"orders"

).innerText=

data.total_orders||0;

document.getElementById(

"delivered"

).innerText=

data.delivered_orders||0;

document.getElementById(

"pending"

).innerText=

data.pending_orders||0;

document.getElementById(

"todaySales"

).innerText=

"₹"+

Number(data.today_revenue||0)

.toFixed(2);

document.getElementById(

"monthlySales"

).innerText=

"₹"+

Number(data.monthly_revenue||0)

.toFixed(2);

const totalOrders=

Number(data.total_orders||0);

const pending=

Number(data.pending_orders||0);

const delivered=

Number(data.delivered_orders||0);

const pendingPercent=

totalOrders===0

?

0

:

((pending/totalOrders)*100).toFixed(1);

const deliveredPercent=

totalOrders===0

?

0

:

((delivered/totalOrders)*100).toFixed(1);

document.getElementById(

"pendingPercent"

).innerText=

pendingPercent+"%";

document.getElementById(

"deliveredPercent"

).innerText=

deliveredPercent+"%";

document.getElementById(

"pendingBar"

).style.width=

pendingPercent+"%";

document.getElementById(

"deliveredBar"

).style.width=

deliveredPercent+"%";

loadTopProducts();

}

catch(error){

console.error(error);

alert(

"Failed To Load Analytics"

);

}

}

async function loadTopProducts(){

try{

const response=

await fetch(

"http://localhost:5000/top-products"

);

const products=

await response.json();

let html="";

products.forEach(product=>{

html+=`

<tr>

<td>

${product.product_name}

</td>

<td>

${product.total_qty}

</td>

</tr>

`;

});

if(html===""){

html=`

<tr>

<td colspan="2">

No Records Found

</td>

</tr>

`;

}

document.getElementById(

"topProductsBody"

).innerHTML=

html;

}

catch(error){

console.error(error);

}

}

loadAnalytics();

</script>

</body>

</html>
