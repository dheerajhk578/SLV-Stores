<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SLV Stores Login

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:#111;

background-image:

radial-gradient(circle at top,#2a2a2a 0%,#111 70%);

overflow-x:hidden;

}

.login-container{

width:100%;

max-width:460px;

animation:fadeIn .8s ease;

}

/* Logo */

.logo-section{

text-align:center;

margin-bottom:25px;

}

.logo{

width:140px;

height:140px;

background:white;

padding:10px;

border-radius:50%;

border:5px solid #f39c12;

box-shadow:0 0 25px rgba(243,156,18,.6);

transition:.3s;

}

.logo:hover{

transform:scale(1.05);

}

.logo-section h1{

margin-top:15px;

font-size:38px;

color:#f39c12;

letter-spacing:2px;

}

.logo-section h3{

margin-top:8px;

font-weight:normal;

color:white;

}

.location{

margin-top:10px;

color:#bbb;

font-size:15px;

}

/* Login Card */

.login-card{

background:#1b1b1b;

border:2px solid #333;

border-radius:22px;

padding:30px;

margin-bottom:25px;

box-shadow:0 12px 30px rgba(0,0,0,.4);

transition:.3s;

}

.login-card:hover{

border-color:#f39c12;

transform:translateY(-5px);

}

.login-card h2{

text-align:center;

color:#f39c12;

margin-bottom:22px;

font-size:28px;

}

input{

width:100%;

padding:15px;

margin-bottom:18px;

background:#2b2b2b;

border:2px solid transparent;

border-radius:12px;

color:white;

font-size:16px;

outline:none;

transition:.3s;

}

input:focus{

border-color:#f39c12;

box-shadow:0 0 12px rgba(243,156,18,.35);

}

input::placeholder{

color:#999;

}
/* Password */

.password-box{

position:relative;

}

.eye{

position:absolute;

right:15px;

top:15px;

cursor:pointer;

font-size:20px;

color:#f39c12;

user-select:none;

transition:.3s;

}

.eye:hover{

transform:scale(1.15);

}

/* Remember */

.remember{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:18px;

font-size:14px;

color:#ddd;

}

.remember label{

display:flex;

align-items:center;

gap:8px;

cursor:pointer;

}

.remember input{

width:auto;

margin:0;

accent-color:#f39c12;

}

.forgot{

color:#f39c12;

text-decoration:none;

}

.forgot:hover{

text-decoration:underline;

}

/* Buttons */

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

margin-bottom:12px;

}

.login-btn{

background:#f39c12;

color:#111;

}

.login-btn:hover{

background:#ffb84d;

transform:translateY(-2px);

}

.otp-btn{

background:#2ecc71;

color:white;

}

.otp-btn:hover{

background:#27ae60;

transform:translateY(-2px);

}

/* Divider */

.divider{

display:flex;

align-items:center;

justify-content:center;

margin:25px 0;

color:#f39c12;

font-weight:bold;

}

.divider::before,

.divider::after{

content:"";

flex:1;

height:1px;

background:#444;

margin:0 12px;

}

/* Footer */

.footer{

margin-top:20px;

text-align:center;

color:#888;

font-size:14px;

line-height:24px;

}
/* Animation */

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:480px){

.logo{

width:100px;

height:100px;

}

.logo-section h1{

font-size:28px;

}

.login-card{

padding:20px;

}

}

</style>

</head>

<body>

<div class="login-container">

<div class="logo-section">

<img

src="images/logo.jpeg"

class="logo"

alt="SLV Logo">

<h1>

SLV STORES

</h1>

<h3>

Fresh • Quality • Trust

</h3>

<p class="location">

📍 T B CROSS, MAYASANDRA

</p>

</div>

<!-- Admin Login -->

<div class="login-card">

<h2>

👨‍💼 Admin Login

</h2>

<input

type="text"

id="userid"

placeholder="Enter User ID">

<div class="password-box">

<input

type="password"

id="password"

placeholder="Enter Password">

<span

class="eye"

onclick="togglePassword()">

👁

</span>

</div>

<div class="remember">

<label>

<input

type="checkbox"

id="rememberMe">

Remember Me

</label>

<a

href="#"

class="forgot">

Forgot Password?

</a>

</div>

<button

class="login-btn"

onclick="login()">

🔐 LOGIN

</button>

</div>

<div class="divider">

OR

</div>

<!-- Customer Login -->

<div class="login-card">

<h2>

👤 Customer Login

</h2>

<input

type="text"

id="mobile"

placeholder="Enter Mobile Number">

<button

class="otp-btn"

onclick="sendOTP()">

📲 SEND OTP

</button>

<input

type="text"

id="otp"

placeholder="Enter OTP">

<button

class="otp-btn"

onclick="verifyOTP()">

✅ VERIFY OTP

</button>

<div class="footer">

© 2026 SLV STORES

<br>

Fresh • Quality • Trust

</div>

</div>

</div>

<script src="login.js"></script>

</body>

</html>
